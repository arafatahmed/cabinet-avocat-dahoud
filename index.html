<style>
/* Layout: inspiré de la carte de visite — panneaux charbon / blanc côte à côte, or du logo en accent unique.
   Bandes pleine largeur ; propriétés logiques partout pour l'arabe (RTL). */
:root{
  --bg:#ffffff; --alt:#f5f3ef; --surface:#ffffff; --line:#e4dfd6;
  --fg:#231f20; --muted:#665f5c;
  --gold:#9e7c2f; --gold-ink:#7f6320; --gold-hi:#c4a258;
  --char:#231f20; --char-2:#2c2728; --char-line:#3e3738; --on-char:#f4f1ec; --on-char-muted:#b4aca5;
  --ok:#1f7a4d; --ok-bg:#e3f1e8; --wa:#1f8f4e;
  --f-display:"Jost","Century Gothic","Avenir Next",system-ui,sans-serif;
  --f-body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root:lang(ar){
  --f-display:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171415; --alt:#1e1a1b; --surface:#221e1f; --line:#3a3334;
  --fg:#efebe5; --muted:#aaa19a; --gold:#c4a258; --gold-ink:#d2b16a; --gold-hi:#d6b86e;
  --char:#100e0f; --char-2:#1b1718; --char-line:#352f30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171415; --alt:#1e1a1b; --surface:#221e1f; --line:#3a3334;
  --fg:#efebe5; --muted:#aaa19a; --gold:#c4a258; --gold-ink:#d2b16a; --gold-hi:#d6b86e;
  --char:#100e0f; --char-2:#1b1718; --char-line:#352f30; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--f-body);padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
:lang(ar) body{line-height:1.85}
:lang(ar) *{letter-spacing:0!important}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
a{color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1200px;margin:0 auto;padding-inline:28px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:11px 20px;border-radius:2px;cursor:pointer;font-weight:600;font-size:14.5px;letter-spacing:.04em;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,border-color .2s,color .2s,filter .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn.gold{background:var(--gold-hi);border-color:var(--gold-hi);color:#231f20}
.btn.gold:hover{filter:brightness(1.07)}
.btn.dark{background:var(--char);border-color:var(--char);color:var(--on-char)}
.btn.dark:hover{background:var(--char-2)}
.btn.ghost{background:transparent;border-color:var(--char-line);color:var(--on-char)}
.btn.ghost:hover{border-color:var(--gold-hi);color:var(--gold-hi)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.line{background:transparent;border-color:var(--gold);color:var(--gold-ink)}
.btn.line:hover{background:var(--gold);color:#fff}

/* ---------- En-tête ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--char);color:var(--on-char);border-bottom:1px solid var(--char-line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;height:78px}
.logo{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:start}
.logo img{width:50px;height:auto;display:block}
.logo b{display:block;white-space:nowrap;font-family:"Jost",sans-serif;font-weight:600;font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.logo small{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-hi);margin-top:5px;font-weight:500}
:lang(ar) .logo b{font-family:"Noto Kufi Arabic",sans-serif;font-size:17px;text-transform:none}
:lang(ar) .logo small{font-size:12px;font-family:"IBM Plex Sans Arabic",sans-serif}
.right{display:flex;align-items:center;gap:14px}
.nav{display:flex;align-items:center;gap:2px}
.nav button{white-space:nowrap;background:none;border:0;color:var(--on-char-muted);padding:8px 11px;cursor:pointer;font-size:14px;font-weight:500;position:relative;letter-spacing:.02em}
.nav button:hover,.nav button[aria-current="true"]{color:var(--on-char)}
.nav button[aria-current="true"]::after{content:"";position:absolute;inset-inline:11px;bottom:1px;height:1px;background:var(--gold-hi)}
.langs{display:inline-flex;border:1px solid var(--char-line);border-radius:999px;padding:2px;gap:2px}
.langs button{background:none;border:0;color:var(--on-char-muted);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;cursor:pointer;min-width:36px}
.langs button[aria-pressed="true"]{background:var(--gold-hi);color:#231f20}
.langs button[lang="ar"]{font-family:"Noto Kufi Arabic",sans-serif;font-size:13px}
.space{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--gold-hi);color:var(--gold-hi);padding:7px 13px;border-radius:2px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;letter-spacing:.03em}
.space:hover{background:var(--gold-hi);color:#231f20}
.space svg{width:14px;height:14px}
.burger{display:none;background:none;border:1px solid var(--char-line);color:var(--on-char);border-radius:2px;padding:8px 12px;cursor:pointer}

/* ---------- Diaporama ---------- */
.slider{position:relative;background:var(--char);color:var(--on-char);overflow:hidden;min-height:600px;display:grid}
.slide{grid-area:1/1;position:relative;display:flex;align-items:center;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.slide.on{opacity:1;visibility:visible;transition:opacity .9s ease}
.slide .art{position:absolute;inset-block:0;inset-inline-end:0;width:min(58%,880px);overflow:hidden}
.slide .art img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.05);transition:transform 7s ease-out}
.slide.on .art img{transform:scale(1)}
[dir="rtl"] .slide .art img{transform:scaleX(-1) scale(1.05)}
[dir="rtl"] .slide.on .art img{transform:scaleX(-1)}
.slide .art::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,var(--char) 0,rgb(35 31 32 / 0) 42%),linear-gradient(to top,var(--char) 0,rgb(35 31 32 / 0) 24%)}
[dir="rtl"] .slide .art::after{background:linear-gradient(to left,var(--char) 0,rgb(35 31 32 / 0) 42%),linear-gradient(to top,var(--char) 0,rgb(35 31 32 / 0) 24%)}
.slide .wrap{position:relative;width:100%;padding-block:90px 120px}
.slide .txt{max-width:min(590px,50%)}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-hi);font-weight:600;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}
:lang(ar) .eyebrow{font-size:14px}
.slide .h{font-family:var(--f-display);font-weight:500;font-size:clamp(38px,5.4vw,68px);line-height:1.08;margin:22px 0;letter-spacing:-.01em;text-wrap:balance}
:lang(ar) .slide .h{font-weight:700;font-size:clamp(32px,4.4vw,54px);line-height:1.5}
.slide .h em{font-style:normal;color:var(--gold-hi)}
.slide p.lead{font-size:18px;color:var(--on-char-muted);max-width:48ch;margin:0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px;align-items:center}
.ctrl{position:absolute;inset-inline:0;bottom:30px;z-index:3}
.ctrl .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.dots{display:flex;gap:10px;align-items:center}
.dots button{width:36px;height:20px;background:none;border:0;cursor:pointer;padding:0;position:relative}
.dots button::before{content:"";position:absolute;inset-inline:0;top:9px;height:2px;background:var(--char-line)}
.dots button[aria-current="true"]::before{background:var(--gold-hi)}
.count{font-size:12.5px;color:var(--on-char-muted);margin-inline-start:8px;font-variant-numeric:tabular-nums;letter-spacing:.1em}
.arrows{display:flex;gap:8px}
.arrows button{width:44px;height:44px;border-radius:50%;border:1px solid var(--char-line);background:rgb(16 14 15 / .45);color:var(--on-char);cursor:pointer;display:grid;place-items:center}
.arrows button:hover{border-color:var(--gold-hi);color:var(--gold-hi)}
.arrows svg{width:18px;height:18px}

/* ---------- Bandeau coordonnées ---------- */
.info{background:var(--surface);border-bottom:1px solid var(--line)}
.info dl{margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:stretch}
.info .cell{padding-block:20px;padding-inline:0 20px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.info .cell+.cell{padding-inline-start:20px;border-inline-start:1px solid var(--line)}
.info .ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;flex:none}
.info .ic svg{width:16px;height:16px}
.info dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.info dd{margin:0;font-weight:500;font-size:14.5px;overflow-wrap:anywhere;line-height:1.5}
.info .act{display:flex;align-items:center;padding-inline-start:20px;border-inline-start:1px solid var(--line)}

/* ---------- Sections ---------- */
.sec{padding-block:100px}
.sec.alt{background:var(--alt)}
.kicker{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-ink);font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:22px;height:1px;background:currentColor}
:lang(ar) .kicker{font-size:14px}
.h2{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,3.8vw,46px);line-height:1.12;margin:0;text-wrap:balance;max-width:20ch;letter-spacing:-.005em}
:lang(ar) .h2{font-weight:700;line-height:1.55;font-size:clamp(26px,3.2vw,38px)}
.prose{color:var(--muted);font-size:17px;max-width:62ch;display:flex;flex-direction:column;gap:14px}
.prose p{margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:48px}
.head p{color:var(--muted);max-width:46ch;margin:0}

.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:center}
.stack{display:flex;flex-direction:column;gap:22px}
.stack .kicker{margin:0}
.fig{margin:0;position:relative;aspect-ratio:4/3;max-width:100%;background:var(--char)}
.fig img{width:100%;height:100%;object-fit:cover;display:block}
.fig.framed{margin-inline-end:20px;margin-bottom:20px;isolation:isolate}
.fig.framed::before{content:"";position:absolute;inset:20px -20px -20px 20px;border:1px solid var(--gold);z-index:-1}
[dir="rtl"] .fig.framed::before{inset:20px 20px -20px -20px}
.fig figcaption{position:absolute;inset-inline-start:0;bottom:0;background:var(--char);color:var(--on-char);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;padding:9px 16px;font-weight:600}
.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:64px;border-top:1px solid var(--line)}
.values div{padding-block:26px 0;padding-inline:0 26px;display:flex;flex-direction:column;gap:6px}
.values div+div{padding-inline-start:26px;border-inline-start:1px solid var(--line)}
.values b{font-family:var(--f-display);font-size:21px;font-weight:600}
.values span{color:var(--muted);font-size:15px}

/* Fondateur : reprise de la carte de visite */
.card{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);box-shadow:0 30px 60px -30px rgb(35 31 32 / .45);background:var(--surface);border:1px solid var(--line)}
.card .pane-d{background:var(--char);color:var(--on-char);padding:56px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;position:relative;overflow:hidden}
.card .pane-d::before{content:"";position:absolute;inset:16px;border:1px solid var(--char-line)}
.card .pane-d img{width:min(210px,70%);position:relative}
.card .mark{position:relative;font-family:"Jost",sans-serif;text-transform:uppercase;line-height:1.25}
.card .mark b{display:block;font-size:26px;font-weight:600;letter-spacing:.04em}
.card .mark span{display:block;font-size:17px;font-weight:600;letter-spacing:.32em;margin-top:6px}
.card .mark.ar{font-family:"Noto Kufi Arabic",sans-serif;text-transform:none;font-size:16px;font-weight:600;line-height:1.7;letter-spacing:0;color:var(--on-char-muted)}
.card .pane-l{padding:56px 52px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.card .name{font-family:"Jost",sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);color:var(--gold);line-height:1.1;margin:0}
:lang(ar) .card .name{font-family:"Noto Kufi Arabic",sans-serif}
.card .title{font-weight:600;font-size:18px;margin:0;line-height:1.5}
.card .bio{color:var(--muted);margin:0;max-width:56ch}
.card ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.card li{display:flex;gap:12px;align-items:flex-start}
.card li svg{width:18px;height:18px;color:var(--gold);flex:none;margin-top:4px}

/* Expertises */
.exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.exp article{background:var(--surface);padding:34px 30px 36px;display:flex;flex-direction:column;gap:10px;transition:background .25s;position:relative}
.exp article::after{content:"";position:absolute;inset-inline-start:0;top:0;height:2px;width:0;background:var(--gold);transition:width .35s}
.exp article:hover::after{width:100%}
.exp .ico{width:48px;height:48px;border-radius:50%;background:var(--char);color:var(--gold-hi);display:grid;place-items:center;margin-bottom:10px}
.exp .ico svg{width:22px;height:22px}
.exp h3{margin:0;font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.3}
.exp p{margin:0;color:var(--muted);font-size:15px}

/* Méthode */
.meth{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:64px;align-items:center}
.meth .fig{aspect-ratio:1/1}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;padding:0;margin:0}
.steps li{list-style:none;display:flex;flex-direction:column;gap:8px;padding-top:18px;border-top:2px solid var(--gold)}
.steps .n{font-size:12px;color:var(--gold-ink);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.steps b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.3}
.steps span{color:var(--muted);font-size:15px}

/* Galerie */
.gal{columns:3 280px;column-gap:16px}
.gal figure{break-inside:avoid;margin:0 0 16px;position:relative;cursor:zoom-in;overflow:hidden;background:var(--char)}
.gal img{display:block;width:100%;height:auto;transition:transform .6s ease}
.gal figure.tall img{aspect-ratio:3/4;object-fit:cover}
.gal figure:hover img{transform:scale(1.04)}
.gal figcaption{position:absolute;inset-inline:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(to top,rgb(16 14 15 / .85),transparent);color:#f4f1ec;font-size:14px;font-weight:500}
.lb{position:fixed;inset:0;background:rgb(12 10 11 / .95);z-index:70;display:grid;grid-template-rows:auto 1fr auto;color:#f4f1ec;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.lb .bar{display:flex;justify-content:space-between;align-items:center}
.lb .stage{display:grid;place-items:center;min-height:0;position:relative}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain}
.lb .cap{text-align:center;padding-top:12px;color:#cfc7bf}
.lb button{background:rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .2);color:#f4f1ec;border-radius:50%;width:46px;height:46px;cursor:pointer;display:grid;place-items:center}
.lb button:hover{border-color:#c4a258;color:#c4a258}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .nav.p{inset-inline-start:0} .lb .nav.n{inset-inline-end:0}
.lb svg{width:20px;height:20px}

/* FAQ */
.faq{display:flex;flex-direction:column;border-top:1px solid var(--line);max-width:880px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding-block:22px;padding-inline:0 44px;font-family:var(--f-display);font-size:19px;font-weight:600;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;inset-inline-end:6px;top:18px;font-weight:400;font-size:26px;color:var(--gold)}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 22px;color:var(--muted);max-width:70ch}

/* Contact */
.contact{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:64px;align-items:start}
.coords{display:flex;flex-direction:column;gap:20px;margin:30px 0 0}
.coords div{display:flex;flex-direction:column;gap:3px}
.coords dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.coords dd{margin:0;font-size:16.5px;line-height:1.55}
.coords .sel{user-select:all}
.map{margin:30px 0 0;position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);overflow:hidden;background:var(--alt)}
.map img{width:100%;height:100%;object-fit:cover;display:block}
.map a{position:absolute;inset-inline-end:14px;bottom:14px}
.form{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.sec.alt .form{background:var(--surface)}
.form h3{grid-column:1/-1;margin:0 0 4px;font-family:var(--f-display);font-size:22px;font-weight:600}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:11px 13px;font-weight:400;font-size:15.5px;width:100%}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgb(158 124 47 / .18)}
.form textarea{min-height:130px;resize:vertical}
.form .chk{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:13.5px}
.form .chk input{width:auto;margin-top:4px;accent-color:var(--gold)}
.form .sends{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.form .hint{grid-column:1/-1;color:var(--muted);font-size:13px;margin:0}
.done{grid-column:1/-1;background:var(--ok-bg);color:var(--ok);padding:14px 16px;font-weight:500}

/* Pied de page */
.foot{background:var(--char);color:var(--on-char-muted);font-size:14px}
.foot .wrap{display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:40px;padding-block:64px 30px}
.foot .brand{display:flex;gap:16px;align-items:flex-start}
.foot .brand img{width:64px}
.foot .brand b{color:var(--on-char);font-family:"Jost",sans-serif;font-weight:600;font-size:19px;letter-spacing:.06em;text-transform:uppercase;display:block}
.foot .brand .ar{font-family:"Noto Kufi Arabic",sans-serif;color:var(--on-char-muted);font-size:14px;margin-top:4px;display:block;direction:rtl;text-align:start}
.foot h4{margin:0 0 14px;color:var(--gold-hi);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.foot ul button{background:none;border:0;color:inherit;padding:0;cursor:pointer;font-size:14px;text-align:start}
.foot ul button:hover{color:var(--on-char)}
.legal{border-top:1px solid var(--char-line);grid-column:1/-1;padding-top:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px}
.fab{display:none;position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;place-items:center;box-shadow:0 10px 24px rgb(0 0 0 / .3)}
.fab svg{width:28px;height:28px}
.toast{position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--char);color:var(--on-char);padding:11px 16px;font-weight:500;z-index:80;max-width:calc(100% - 32px);border-inline-start:3px solid var(--gold-hi)}
[dir="rtl"] .toast{transform:translateX(50%)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .nav{display:none;position:absolute;top:78px;inset-inline:0;background:var(--char);flex-direction:column;align-items:stretch;padding:8px 20px 18px;border-bottom:1px solid var(--char-line)}
  .nav.open{display:flex}
  .nav button{text-align:start;padding:13px 6px;font-size:15px}
  .nav button[aria-current="true"]::after{display:none}
  .burger{display:block}
}
@media (max-width:900px){
  .intro,.contact,.meth,.card{grid-template-columns:1fr;gap:44px}
  .card{gap:0}
  .exp{grid-template-columns:repeat(2,minmax(0,1fr))}
  .info dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .info .cell{border-bottom:1px solid var(--line)}
  .info .cell:nth-child(3){padding-inline-start:0;border-inline-start:0}
  .info .act{grid-column:1/-1;padding:16px 0;border:0}
  .foot .wrap{grid-template-columns:1fr 1fr}
  .foot .wrap>div:first-child{grid-column:1/-1}
  .fab{display:grid}
  .slider{min-height:640px}
  .slide{align-items:flex-end}
  .slide .art{width:100%;inset-block:0 auto;height:58%}
  .slide .art::after,[dir="rtl"] .slide .art::after{background:linear-gradient(to top,var(--char) 0,rgb(35 31 32 / 0) 62%)}
  .slide .txt{max-width:none}
  .slide .wrap{padding-block:240px 110px}
  .space span{display:none}
}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .sec{padding-block:68px}
  .top .wrap{gap:10px;height:70px}
  .logo{gap:8px}
  .logo img{width:34px}
  .logo b{font-size:15px}
  .right{gap:6px}
  html{scroll-padding-top:76px}
  .nav{top:70px}
  .logo small{display:none}
  .exp,.steps,.values{grid-template-columns:1fr}
  .values div+div{padding-inline-start:0;border-inline-start:0;border-top:1px solid var(--line)}
  .values div{padding-bottom:22px}
  .form{grid-template-columns:1fr;padding:22px}
  .info dl{grid-template-columns:1fr}
  .info .cell,.info .cell+.cell{padding-inline:0;border-inline-start:0}
  .card .pane-l,.card .pane-d{padding:40px 24px}
  .slide .wrap{padding-block:200px 104px}
  .slider{min-height:660px}
  .arrows{display:none}
  .langs button{padding:4px 5px;min-width:26px;font-size:11px}
  .space{gap:0;padding:7px}
  .burger{padding:8px}
}
@media (max-width:360px){
  .top .wrap{height:auto;min-height:70px;flex-wrap:wrap;gap:8px;padding-block:8px}
  .right{width:100%;justify-content:space-between}
  .nav{top:114px}
  html{scroll-padding-top:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.slide .art img{transform:none!important}[dir="rtl"] .slide .art img{transform:scaleX(-1)!important}}

        <div><dt>${t("k_hours")}</dt><dd>${t("hours")}</dd></div>
      </dl>
      <figure class="map"><img src="${ARTURL.carte}" alt="${esc(ILLU[5].cap[LI()])}"><a class="btn dark" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CABINET.mapsQuery)}" target="_blank" rel="noopener">${IC.pin}${t("maps")}</a></figure>
    </div>
    <form class="form" id="form" novalidate>
      <h3>${t("k_form")}</h3>
      <label>${t("k_nom")} *<input id="c-nom" autocomplete="name"></label>
      <label>${t("k_tel")} *<input id="c-tel" type="tel" autocomplete="tel" dir="ltr"></label>
      <label class="full">${t("k_dom")}<select id="c-dom">${DOMAINES.map(([k])=>`<option value="${k}">${esc(t(k))}</option>`).join("")}</select></label>
      <label class="full">${t("k_msg")} *<textarea id="c-msg" placeholder="${esc(t("k_msgph"))}"></textarea></label>
      <label class="chk full"><input id="c-ok" type="checkbox">${t("k_ok")}</label>
      <div class="sends"><button class="btn wa" type="submit" data-via="wa">${IC.wa}${t("k_wa")}</button><button class="btn line" type="submit" data-via="mail">${IC.mail}${t("k_mail")}</button></div>
      <p class="hint">${t("k_hint")}</p>
      <div class="done" id="c-done" hidden>${t("k_done")}</div>
    </form>
  </div></section>

  <footer class="foot"><div class="wrap">
    <div><div class="brand"><img src="${LOGO}" alt=""><div><b>Cabinet Dahoud</b><span class="ar" lang="ar">مكتب دحود للمحاماة والاستشارات القانونية</span><p style="margin:12px 0 0;max-width:40ch">${t("ft_desc")}</p></div></div></div>
    <div><h4>${t("ft_site")}</h4><ul>${siteSections().map(([id,k])=>`<li><button data-go="${id}">${t(k)}</button></li>`).join("")}</ul></div>
    <div><h4>${t("ft_contact")}</h4><ul class="ltr" style="text-align:start"><li>${CABINET.tel}</li><li>${CABINET.whatsapp[0]}</li><li>${CABINET.email}</li><li>${CABINET.web}</li></ul></div>
    <div class="legal"><span>${t("ft_rights")}</span><span>${t("ft_legal")}</span></div>
  </div></footer>
  <a class="fab" href="https://wa.me/${wa0}" target="_blank" rel="noopener" aria-label="WhatsApp">${IC.wa}</a>`;
  setupSpy(); startSlides();
}

/* Diaporama */
function showSlide(i){
  slideIdx=(i+3)%3;
  document.querySelectorAll(".slide").forEach((el,k)=>{
    const on=k===slideIdx; el.classList.toggle("on",on);
    on?el.removeAttribute("aria-hidden"):el.setAttribute("aria-hidden","true");
    el.querySelectorAll("button").forEach(b=>on?b.removeAttribute("tabindex"):b.setAttribute("tabindex","-1"));
  });
  document.querySelectorAll("[data-slide]").forEach((b,k)=>b.setAttribute("aria-current",k===slideIdx));
  const c=document.getElementById("scount"); if(c) c.textContent=`0${slideIdx+1} / 03`;
}
function startSlides(){ clearInterval(slideTimer); if(reduced()) return; slideTimer=setInterval(()=>{ if(!slidePaused&&!document.hidden) showSlide(slideIdx+1); },6500); }

/* Menu actif au défilement */
let spy=null;
function setupSpy(){
  spy?.disconnect(); if(!("IntersectionObserver" in window)) return;
  spy=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting) document.querySelectorAll("[data-spy]").forEach(b=>b.setAttribute("aria-current",b.dataset.spy===en.target.id)); }),{rootMargin:"-45% 0px -50% 0px"});
  SECTIONS.forEach(([id])=>{ const el=document.getElementById(id); if(el) spy.observe(el); });
}

/* Visionneuse */
let lbIdx=0;
function openLB(i){
  const g=galItems(); lbIdx=(i+g.length)%g.length; const p=g[lbIdx];
  document.getElementById("lb-root").innerHTML=`<div class="lb" role="dialog" aria-modal="true" aria-label="${esc(t("g_k"))}">
    <div class="bar"><span class="ltr" style="font-size:13px;letter-spacing:.1em">${lbIdx+1} / ${g.length}</span><button id="lb-x" aria-label="${t("lb_close")}">${IC.close}</button></div>
    <div class="stage"><img src="${esc(p.img)}" alt="${esc(p.cap)}">${g.length>1?`<button class="nav p" data-lbs="-1" aria-label="${t("prev")}">${flipArrow(-1)}</button><button class="nav n" data-lbs="1" aria-label="${t("next")}">${flipArrow(1)}</button>`:""}</div>
    <div class="cap">${esc(p.cap)}</div></div>`;
  document.getElementById("lb-x").focus();
}
const closeLB=()=>{ document.getElementById("lb-root").innerHTML=""; };
document.getElementById("lb-root").addEventListener("click",e=>{
  if(e.target.closest("#lb-x")||e.target.classList.contains("lb")||e.target.classList.contains("stage")) return closeLB();
  const s=e.target.closest("[data-lbs]"); if(s) openLB(lbIdx+Number(s.dataset.lbs));
});

function toast(m){ const el=document.createElement("div"); el.className="toast"; el.textContent=m; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }

/* Événements */
const site=document.getElementById("site");
site.addEventListener("click",e=>{
  const lg=e.target.closest("[data-lang]"); if(lg){ setLang(lg.dataset.lang); return; }
  if(e.target.closest("#burger")){ const n=document.getElementById("nav"); n.classList.toggle("open"); e.target.closest("#burger").setAttribute("aria-expanded",n.classList.contains("open")); return; }
  const sd=e.target.closest("[data-slide]"); if(sd){ showSlide(+sd.dataset.slide); startSlides(); return; }
  const st=e.target.closest("[data-step]"); if(st){ showSlide(slideIdx+(+st.dataset.step)); startSlides(); return; }
  const lb=e.target.closest("[data-lb]"); if(lb){ openLB(+lb.dataset.lb); return; }
  const g=e.target.closest("[data-go]"); if(!g) return;
  document.getElementById("nav")?.classList.remove("open"); document.getElementById("burger")?.setAttribute("aria-expanded","false");
  const el=document.getElementById(g.dataset.go); if(!el) return;
  const y=g.dataset.go==="top"?0:el.getBoundingClientRect().top+window.scrollY-76;
  window.scrollTo({top:Math.max(0,y),behavior:reduced()?"auto":"smooth"});
});
site.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-lb]")){ e.preventDefault(); openLB(+e.target.dataset.lb); } });
site.addEventListener("mouseover",e=>{ slidePaused=!!e.target.closest(".slider"); });
site.addEventListener("focusin",e=>{ slidePaused=!!e.target.closest(".slider"); });
let tx=null;
site.addEventListener("touchstart",e=>{ if(e.target.closest(".slider")) tx=e.touches[0].clientX; },{passive:true});
site.addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>50){ showSlide(slideIdx+(dx<0?1:-1)*(lang==="ar"?-1:1)); startSlides(); } });
site.addEventListener("submit",e=>{
  if(e.target.id!=="form") return;
  e.preventDefault();
  const via=e.submitter?.dataset.via||"wa", v=id=>document.getElementById(id).value.trim();
  const miss=[["c-nom","k_nom"],["c-tel","k_tel"],["c-msg","k_msg"]].find(([id])=>!v(id));
  if(miss){ toast(`${t("k_need")} : ${t(miss[1])}`); document.getElementById(miss[0]).focus(); return; }
  if(!document.getElementById("c-ok").checked){ toast(t("k_needok")); return; }
  const dom=document.getElementById("c-dom"), domTxt=dom.options[dom.selectedIndex].text;
  const body=`${t("msg_intro")}\n\n${t("k_nom")} : ${v("c-nom")}\n${t("k_tel")} : ${v("c-tel")}\n${t("k_dom")} : ${domTxt}\n\n${v("c-msg")}`;
  const url = via==="mail"
    ? `mailto:${CABINET.email}?subject=${encodeURIComponent(t("cta_rdv")+" — "+v("c-nom"))}&body=${encodeURIComponent(body)}`
    : `https://wa.me/${digits(CABINET.whatsapp[0])}?text=${encodeURIComponent(body)}`;
  const w = via==="mail" ? null : window.open(url,"_blank","noopener");
  if(!w) location.href=url;
  document.getElementById("c-done").hidden=false;
});
document.addEventListener("keydown",e=>{
  if(!document.getElementById("lb-root").innerHTML) return;
  if(e.key==="Escape") closeLB();
  if(e.key==="ArrowRight") openLB(lbIdx+(lang==="ar"?-1:1));
  if(e.key==="ArrowLeft") openLB(lbIdx+(lang==="ar"?1:-1));
});

function setLang(l){
  if(!LANGS.includes(l)||l===lang) return;
  const y=window.scrollY; lang=l; try{ localStorage.setItem("dahoud-lang",l); }catch{}
  applyLang(); render(); closeLB(); window.scrollTo(0,y);
}
function applyLang(){
  const h=document.documentElement; h.lang=lang; h.dir=lang==="ar"?"rtl":"ltr";
  document.title = lang==="ar" ? "مكتب دحود للمحاماة والاستشارات القانونية" : lang==="en" ? "Dahoud Law Firm" : "Cabinet Dahoud";
}
async function initializeSite(){
  try{
    const response=await fetch("/espace-client/api/public-site/",{headers:{Accept:"application/json"}});
    if(!response.ok) throw new Error(`Le serveur a répondu ${response.status}.`);
    const content=await response.json();
    Object.entries(content.translations||{}).forEach(([key,values])=>{
      if(!Array.isArray(values)||!D[key]) return;
      D[key]=values.map((value,index)=>value?esc(value):D[key][index]);
    });
    const contact=content.contact||{};
    if(contact.tel) CABINET.tel=esc(contact.tel);
    if(contact.whatsapp) CABINET.whatsapp=contact.whatsapp.split(/[,\n;]/).map(value=>esc(value.trim())).filter(Boolean);
    if(contact.fixe) CABINET.fixe=contact.fixe.split(/[,\n;]/).map(value=>esc(value.trim())).filter(Boolean);
    if(contact.email) CABINET.email=esc(contact.email);
    if(contact.web) CABINET.web=esc(contact.web);
    if(contact.mapsQuery) CABINET.mapsQuery=contact.mapsQuery;
    if(contact.address&&!content.translations?.addr) D.addr=[esc(contact.address),esc(contact.address),esc(contact.address)];
    if(contact.hours&&!content.translations?.hours) D.hours=[esc(contact.hours),esc(contact.hours),esc(contact.hours)];
    if(Array.isArray(content.photos)&&content.photos.length){
      const photos=content.photos.map(photo=>({
        src:photo.src,
        fr:photo.fr,ar:photo.ar,en:photo.en,slide:Boolean(photo.slide)
      }));
      PHOTOS.splice(0,PHOTOS.length,...photos);
    }
    CMS_PRACTICE_AREAS=(content.practiceAreas||[]).map(area=>({
      title:area.title.map(esc),
      description:area.description.map(esc),
      icon:Math.min(6,Math.max(1,Number(area.icon)||1))
    }));
    CMS_TEAM_MEMBERS=(content.team||[]).map(member=>({
      name:member.name,
      title:member.title,
      bio:member.bio,
      credentials:member.credentials,
      portrait:member.portrait
    }));
    CMS_PUBLICATIONS=(content.publications||[]).map(publication=>({
      category:publication.category.map(esc),
      title:publication.title.map(esc),
      excerpt:publication.excerpt.map(esc)
    }));
  }catch(error){
    console.error("Le contenu dynamique du site n’a pas pu être chargé.",error);
    applyLang(); render();
    toast(lang==="ar"?"تعذّر تحميل آخر تحديثات الموقع.":lang==="en"?"The latest site updates could not be loaded.":"Les dernières mises à jour du site n’ont pas pu être chargées.");
    return;
  }
  applyLang(); render();
}
initializeSite();
</script>
